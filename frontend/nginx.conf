# Nginx configuration that serves the built frontend.
# Adapted from the `Frontend` branch.
#
# The app uses client-side routing, so every unknown path must return
# index.html; otherwise reloading a deep link (e.g. /ejercicios/42) would 404.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compress text responses.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss image/svg+xml;

    # Files with a content hash in their name (JS, CSS, fonts) never change,
    # so browsers may cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
